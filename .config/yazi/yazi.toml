# Overrides only. Anything not set here falls back to yazi's built-in preset,
# which keeps this file from drifting against a stale copy of the defaults on
# every yazi upgrade.
#
# Full preset for reference:
# https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/yazi-default.toml

#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio        = [ 2, 4, 3 ]        # preset: [ 1, 4, 3 ]
show_hidden  = true               # preset: false
mouse_events = [ "click", "scroll" ]  # preset also has "drag"
title_format = "Yazi: {cwd}"

[tasks]
image_bound = [ 5000, 5000 ]      # preset: [ 10000, 10000 ]
